<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Breaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #EAF6FF;
    --bg-2: #FFF3E0;
    --panel: #FFFFFF;
    --ink: #26324A;
    --ink-soft: #5B6A8A;
    --coral: #FF6F59;
    --coral-dark: #E85A45;
    --sun: #FFC93C;
    --mint: #3FC1B0;
    --grape: #8E7DBE;
    --underline: #FF3B7C;
    --ring: #26324A;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
    height: 100%;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-1: #1B2333;
      --bg-2: #241D33;
      --panel: #2A3346;
      --ink: #F1F4FB;
      --ink-soft: #B7C0D6;
      --sun: #FFD666;
      --mint: #52D6C4;
    }
  }
  :root[data-theme="dark"] {
    --bg-1: #1B2333;
    --bg-2: #241D33;
    --panel: #2A3346;
    --ink: #F1F4FB;
    --ink-soft: #B7C0D6;
    --sun: #FFD666;
    --mint: #52D6C4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100%;
    font-family: 'Quicksand', ui-sans-serif, system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 8%, var(--bg-2) 0%, transparent 40%),
      radial-gradient(circle at 90% 85%, var(--bg-2) 0%, transparent 45%),
      var(--bg-1);
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
  }

  .stage {
    width: 100%;
    max-width: 560px;
  }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  h1 {
    font-family: 'Baloo 2', ui-rounded, sans-serif;
    font-weight: 800;
    font-size: clamp(30px, 8vw, 42px);
    margin: 0 0 6px;
    letter-spacing: 0.5px;
  }

  h1 .spark { color: var(--coral); }

  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 15px;
    font-weight: 600;
  }

  .card {
    background: var(--panel);
    border-radius: 28px;
    padding: 26px 22px 22px;
    box-shadow: 0 18px 40px -18px rgba(38, 50, 74, 0.35);
  }

  form {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    font-family: 'Baloo 2', ui-rounded, sans-serif;
    font-size: 22px;
    font-weight: 700;
    padding: 14px 18px;
    border-radius: 18px;
    border: 3px solid #DCE4F2;
    outline: none;
    color: var(--ink);
    background: var(--bg-1);
  }
  :root[data-theme="dark"] input[type="text"],
  @media (prefers-color-scheme: dark) { input[type="text"] { border-color: #3A4560; } }
  input[type="text"]:focus {
    border-color: var(--coral);
    box-shadow: 0 0 0 4px rgba(255, 111, 89, 0.22);
  }

  button {
    font-family: 'Baloo 2', ui-rounded, sans-serif;
    font-weight: 700;
    font-size: 17px;
    border: none;
    border-radius: 18px;
    padding: 0 20px;
    background: var(--coral);
    color: #fff;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
    white-space: nowrap;
  }
  button:hover { background: var(--coral-dark); }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

  .hint {
    margin: 12px 2px 0;
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .result {
    margin-top: 22px;
    min-height: 96px;
  }

  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    font-weight: 600;
    padding: 22px 10px;
    font-size: 15px;
  }

  .chain {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px;
    animation: pop 0.32s ease;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .syl {
    font-family: 'Baloo 2', ui-rounded, sans-serif;
    font-weight: 700;
    font-size: clamp(24px, 7vw, 34px);
    padding: 10px 16px;
    border-radius: 16px;
    color: #26324A;
    text-decoration: none;
  }
  :root[data-theme="dark"] .syl,
  @media (prefers-color-scheme: dark) { .syl { color: #17202F; } }
  .syl u {
    text-decoration-line: underline;
    text-decoration-color: var(--underline);
    text-decoration-thickness: 4px;
    text-underline-offset: 3px;
    text-decoration-skip-ink: none;
  }
  .syl:nth-of-type(3n+1) { background: var(--sun); }
  .syl:nth-of-type(3n+2) { background: var(--mint); }
  .syl:nth-of-type(3n+3) { background: var(--grape); color: #fff; }
  .syl:nth-of-type(3n+3) u { text-decoration-color: #FFE066; }

  .pipe {
    font-family: 'Baloo 2', ui-rounded, sans-serif;
    font-weight: 800;
    font-size: clamp(24px, 6vw, 32px);
    color: var(--ink-soft);
    opacity: 0.55;
  }

  .controls-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .say-btn {
    background: var(--mint);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
  }
  .say-btn:hover { background: #2FAE9E; }

  .word-count {
    text-align: center;
    margin-top: 10px;
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .suggestions {
    margin-top: 18px;
    text-align: center;
  }
  .suggestions p {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .chip {
    background: transparent;
    border: 2px solid #DCE4F2;
    color: var(--ink);
    font-size: 14px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
  }
  @media (prefers-color-scheme: dark) { .chip { border-color: #3A4560; } }
  .chip:hover { border-color: var(--coral); background: transparent; }

  footer {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <h1>Word <span class="spark">Breaker</span> 🔤</h1>
    <p>Type a word and see its syllables and sound teams!</p>
  </header>

  <div class="card">
    <form id="wordForm">
      <input
        id="wordInput"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Type a word..."
        aria-label="Type a word to break apart"
      >
      <button type="submit">Break it up! 🎉</button>
    </form>
    <p class="hint">Syllables are split with a | · sound teams are <u>underlined</u></p>

    <div class="result" id="result">
      <p class="empty-state">Try a word like <strong>sticker</strong>, <strong>rainbow</strong>, or a silly made-up word like <strong>bloshting</strong>!</p>
    </div>

    <div class="suggestions">
      <p>Or tap a word:</p>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <footer>Best-effort sound breakdown — some tricky words may not split perfectly.</footer>
</div>

<script>
(function () {
  // ---------- 1. Curated word list (guaranteed-correct) ----------
  var CURATED = {
    "book":    { syllables: ["book"],           multigraphs: [["oo"]] },
    "clip":    { syllables: ["clip"],           multigraphs: [[]] },
    "ruler":   { syllables: ["ru", "ler"],      multigraphs: [[], []] },
    "crayon":  { syllables: ["cray", "on"],     multigraphs: [["ay"], []] },
    "eraser":  { syllables: ["e", "ra", "ser"], multigraphs: [[], [], []] },
    "sticker": { syllables: ["stick", "er"],    multigraphs: [["ck"], []] },
    "pencil":  { syllables: ["pen", "cil"],     multigraphs: [[], []] },
    "paper":   { syllables: ["pa", "per"],      multigraphs: [[], []] }
  };

  // ---------- 2. Multigraph patterns for underlining (longest first) ----------
  var MULTIGRAPHS = [
    "eigh", "augh", "ough",
    "tch", "dge", "igh",
    "ai", "ay", "ea", "ee", "ey", "ie", "oa", "oe", "oo", "ou", "ow", "oy", "oi",
    "au", "aw", "ue", "ui",
    "ar", "er", "ir", "or", "ur",
    "ck", "ng", "ph", "wh", "th", "sh", "ch", "qu", "wr", "kn", "gn"
  ].sort(function (a, b) { return b.length - a.length; });

  function markMultigraphs(syllable) {
    var segments = [];
    var i = 0;
    var buffer = "";
    while (i < syllable.length) {
      var matched = null;
      for (var m = 0; m < MULTIGRAPHS.length; m++) {
        var pat = MULTIGRAPHS[m];
        if (syllable.substr(i, pat.length).toLowerCase() === pat) { matched = pat; break; }
      }
      if (matched) {
        if (buffer) { segments.push({ text: buffer, u: false }); buffer = ""; }
        segments.push({ text: syllable.substr(i, matched.length), u: true });
        i += matched.length;
      } else {
        buffer += syllable[i];
        i += 1;
      }
    }
    if (buffer) segments.push({ text: buffer, u: false });
    return segments;
  }

  // ---------- 3. Fallback rule-based syllable splitter ----------
  var VOWEL_TEAMS = ["augh", "eigh", "ough", "igh", "ai", "ay", "ea", "ee", "ey", "ie", "oa", "oe", "oo", "ou", "ow", "oy", "oi", "au", "aw", "ue", "ui"]
    .sort(function (a, b) { return b.length - a.length; });
  var BLENDS = ["scr", "spl", "spr", "str", "squ", "thr",
    "bl", "br", "cl", "cr", "dr", "fl", "fr", "gl", "gr", "pl", "pr",
    "sc", "sk", "sl", "sm", "sn", "sp", "st", "sw", "tr", "tw", "wr"];
  var STAY_FIRST = ["ck", "ng"];
  var MOVE_SECOND = ["sh", "ch", "th", "ph", "wh", "qu", "gh"];

  function isVowel(ch, idx) {
    if ("aeiou".indexOf(ch) !== -1) return true;
    if (ch === "y" && idx !== 0) return true;
    return false;
  }

  function findNuclei(word) {
    var nuclei = [];
    var i = 0;
    while (i < word.length) {
      if (isVowel(word[i], i)) {
        var matchedTeam = null;
        for (var t = 0; t < VOWEL_TEAMS.length; t++) {
          var team = VOWEL_TEAMS[t];
          if (word.substr(i, team.length) === team) { matchedTeam = team; break; }
        }
        if (matchedTeam) { nuclei.push({ start: i, end: i + matchedTeam.length }); i += matchedTeam.length; }
        else { nuclei.push({ start: i, end: i + 1 }); i += 1; }
      } else { i++; }
    }
    return nuclei;
  }

  function splitSyllablesRuleBased(word) {
    var nuclei = findNuclei(word);
    if (nuclei.length < 2) return [word];

    var splitPoints = [];
    for (var n = 0; n < nuclei.length - 1; n++) {
      var gapStart = nuclei[n].end;
      var gapEnd = nuclei[n + 1].start;
      var cluster = word.slice(gapStart, gapEnd);
      var splitPoint;
      if (cluster.length === 0) splitPoint = gapEnd;
      else if (cluster.length === 1) splitPoint = gapStart;
      else if (cluster.length === 2) {
        if (STAY_FIRST.indexOf(cluster) !== -1) splitPoint = gapStart + 2;
        else if (MOVE_SECOND.indexOf(cluster) !== -1 || BLENDS.indexOf(cluster) !== -1) splitPoint = gapStart;
        else splitPoint = gapStart + 1;
      } else {
        var last3 = cluster.slice(-3), last2 = cluster.slice(-2);
        if (BLENDS.indexOf(last3) !== -1) splitPoint = gapEnd - 3;
        else if (BLENDS.indexOf(last2) !== -1 || MOVE_SECOND.indexOf(last2) !== -1) splitPoint = gapEnd - 2;
        else splitPoint = gapEnd - 1;
      }
      splitPoints.push(splitPoint);
    }

    var syllables = [];
    var prev = 0;
    for (var s = 0; s < splitPoints.length; s++) {
      syllables.push(word.slice(prev, splitPoints[s]));
      prev = splitPoints[s];
    }
    syllables.push(word.slice(prev));
    syllables = syllables.filter(function (x) { return x.length > 0; });

    // Handle trailing consonant+le (e.g. candle -> can|dle, tickle -> tick|le)
    if (syllables.length >= 2 && /^le$/i.test(syllables[syllables.length - 1])) {
      var prevSyl = syllables[syllables.length - 2];
      var take = 1;
      var lastTwo = prevSyl.slice(-2);
      if (STAY_FIRST.indexOf(lastTwo) !== -1) take = 2;
      var newPrev = prevSyl.slice(0, prevSyl.length - take);
      var newLast = prevSyl.slice(prevSyl.length - take) + syllables[syllables.length - 1];
      if (newPrev.length > 0) {
        syllables[syllables.length - 2] = newPrev;
        syllables[syllables.length - 1] = newLast;
      }
    }

    return syllables;
  }

  // ---------- 4. Combine curated + fallback ----------
  function breakWord(rawWord) {
    var word = rawWord.trim();
    var lower = word.toLowerCase();
    if (CURATED[lower]) {
      return CURATED[lower].syllables.slice();
    }
    return splitSyllablesRuleBased(lower);
  }

  // ---------- 5. Rendering ----------
  var resultEl = document.getElementById("result");
  var form = document.getElementById("wordForm");
  var input = document.getElementById("wordInput");

  function speak(text) {
    try {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var utter = new SpeechSynthesisUtterance(text);
      utter.rate = 0.8;
      utter.pitch = 1.05;
      window.speechSynthesis.speak(utter);
    } catch (e) { /* speech not available */ }
  }

  function render(word) {
    if (!word) return;
    var syllables = breakWord(word);

    var chain = document.createElement("div");
    chain.className = "chain";

    syllables.forEach(function (syl, idx) {
      var segs = markMultigraphs(syl);
      var span = document.createElement("span");
      span.className = "syl";
      segs.forEach(function (seg) {
        if (seg.u) {
          var u = document.createElement("u");
          u.textContent = seg.text;
          span.appendChild(u);
        } else {
          span.appendChild(document.createTextNode(seg.text));
        }
      });
      chain.appendChild(span);
      if (idx < syllables.length - 1) {
        var pipe = document.createElement("span");
        pipe.className = "pipe";
        pipe.textContent = "|";
        chain.appendChild(pipe);
      }
    });

    var wrapper = document.createElement("div");
    wrapper.appendChild(chain);

    var controls = document.createElement("div");
    controls.className = "controls-row";
    var sayBtn = document.createElement("button");
    sayBtn.type = "button";
    sayBtn.className = "say-btn";
    sayBtn.textContent = "🔊 Hear it";
    sayBtn.addEventListener("click", function () { speak(word); });
    controls.appendChild(sayBtn);
    wrapper.appendChild(controls);

    var count = document.createElement("div");
    count.className = "word-count";
    count.textContent = syllables.length === 1
      ? "1 syllable"
      : syllables.length + " syllables";
    wrapper.appendChild(count);

    resultEl.innerHTML = "";
    resultEl.appendChild(wrapper);
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    render(input.value);
  });

  // Suggestion chips from the curated list
  var chipsEl = document.getElementById("chips");
  Object.keys(CURATED).forEach(function (w) {
    var chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip";
    chip.textContent = w;
    chip.addEventListener("click", function () {
      input.value = w;
      render(w);
    });
    chipsEl.appendChild(chip);
  });
})();
</script>
</body>
</html>
